[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neural-extremal-graph-search"
version = "0.2.0"
description = "A size-generalization benchmark for neural construction of extremal triangle-free graphs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Ernest Terjyan" }]
keywords = [
  "extremal-graph-theory",
  "graph-neural-networks",
  "reinforcement-learning",
  "turan-theorem",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "matplotlib>=3.9,<4",
  "networkx>=3.3,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "seaborn>=0.13,<1",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
negs = "extremal_graph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/extremal_graph"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
