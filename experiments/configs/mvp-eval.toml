[evaluation]
name = "mvp"
run_dir = "runs"
checkpoint_glob = "mvp-seed-*/best.pt"
output_csv = "results/mvp/evaluation.csv"
sizes = [6, 8, 10, 12, 14, 16, 20, 24]
seeds = [0, 1, 2, 3, 4]
episodes_per_method = 200
methods = ["gnn", "untrained_gnn", "random", "least_degree", "turan_oracle"]
device = "cpu"

[model]
node_feature_dim = 4
candidate_feature_dim = 5
hidden_dim = 64
message_passing_layers = 3
